<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning Dashboard</title>
  <!-- 저장된 테마를 먼저 적용해서 깜빡임을 막는다 (확장 CSP 때문에 인라인 대신 파일) -->
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-left">
        <span id="sky-icon" class="sky-icon" aria-hidden="true"></span>
        <div class="hero-text">
          <span id="today-date" class="hero-date"></span>
          <h1 class="greeting"><span id="greeting"></span>, <input id="name-input" class="name-input" type="text" maxlength="20" placeholder="buddy" aria-label="이름" autocomplete="off"></h1>
          <span>오늘 할 일 <strong id="today-left">0개</strong> 남았어</span>
        </div>
      </div>
      <div class="hero-right">
        <div id="ddays" class="ddays" aria-label="D-day"></div>
        <time id="clock" class="clock num"></time>
        <button id="settings-toggle" class="icon-btn" type="button" aria-label="꾸미기" aria-expanded="false" aria-controls="settings">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <section id="settings" class="card settings" aria-label="꾸미기" hidden>
      <div class="settings-themes">
        <h2>테마 색상</h2>
        <div id="theme-list" class="theme-list"></div>
      </div>
      <div class="settings-photo">
        <h2>배경 사진</h2>
        <div id="photo-picker" class="photo-picker"></div>
      </div>
      <div class="settings-leave">
        <h2>연차</h2>
        <div class="leave-fields">
          <label class="dialog-field">
            <span>입사일</span>
            <input id="hire-date" type="date">
          </label>
          <label class="dialog-field">
            <span>기준</span>
            <select id="leave-basis">
              <option value="hire">입사일 기준</option>
              <option value="fiscal">회계연도 (1월 1일)</option>
            </select>
          </label>
          <label class="dialog-field leave-custom">
            <span>이번 기간에 받은 연차 <small>(회사 기준이 다를 때만)</small></span>
            <input id="leave-custom" type="number" min="0" max="100" step="0.25" inputmode="decimal">
          </label>
        </div>
        <p id="leave-hint" class="settings-hint"></p>
      </div>
      <div class="settings-data">
        <h2>데이터 옮기기</h2>
        <p class="settings-hint">다른 PC나 크롬 확장으로 옮길 때 파일로 내보내고 가져와요</p>
        <div class="data-actions">
          <button id="export-btn" type="button" class="ghost-btn">내보내기</button>
          <label class="ghost-btn file-pick">가져오기<input id="import-input" class="file-input" type="file" accept="application/json,.json"></label>
        </div>
      </div>
    </section>

    <div class="layout">
      <div class="main">
        <div class="columns">
          <div class="left-col">
            <section class="card grass" aria-labelledby="grass-title">
              <div class="grass-head">
                <h2 id="grass-title">잔디</h2>
                <span id="grass-streak" class="grass-streak"></span>
              </div>
              <div id="grass-grid" class="grass-grid" role="img"></div>
              <div class="grass-foot">
                <span id="grass-range">최근 18주</span>
                <span class="grass-legend" aria-hidden="true">적음
                  <span class="grass-cell lv-0"></span><span class="grass-cell lv-1"></span><span class="grass-cell lv-2"></span><span class="grass-cell lv-3"></span><span class="grass-cell lv-4"></span>
                    많음</span>
              </div>
            </section>
            <nav id="folder-tree" class="card" aria-label="폴더"></nav>
          </div>

          <div class="right-col">
            <section class="card board" aria-labelledby="board-title">
              <div id="memo" class="memo"></div>
              <div class="board-head">
                <h2 id="board-title">진행 중인 작업 <span id="board-count" class="board-count num"></span></h2>
                <button id="board-add" type="button" class="dashed-btn">+ 작업 추가</button>
              </div>
              <div id="board-grid" class="board-grid"></div>
            </section>

            <section id="todo-panel" class="card">
              <div class="panel-head">
                <span id="panel-crumb" class="crumb"></span>
                <h2 id="panel-title"></h2>
              </div>

              <form id="todo-form" autocomplete="off">
                <div class="form-head">
                  <span class="form-label">폴더</span>
                  <div id="folder-picker" class="folder-picker"></div>
                </div>

                <input id="todo-text" class="form-text" type="text" placeholder="무엇을 해야 하나요?" aria-label="할 일" required>

                <div class="form-foot">
                  <label class="form-due">
                    <span class="form-label">마감일</span>
                    <input id="todo-due" type="date">
                  </label>
                  <label class="repeat-check">
                    <input id="todo-repeat" type="checkbox"> 반복
                  </label>
                  <div id="repeat-days" class="repeat-days" role="group" aria-label="반복 요일" hidden></div>
                  <button type="submit" class="primary-btn">추가</button>
                </div>
              </form>

              <div id="todo-groups"></div>
            </section>
          </div>

        </div>
      </div>

      <aside class="side">
        <section id="calendar" class="card calendar" aria-label="달력"></section>
        <section class="card progress" aria-labelledby="progress-title">
          <div class="progress-head">
            <h2 id="progress-title">오늘 진행률</h2>
            <span id="progress-num" class="num"></span>
          </div>
          <div class="bar"><div id="progress-bar" class="bar-fill"></div></div>
          <ul id="progress-stats" class="progress-stats"></ul>
        </section>

        <section id="leave" class="card leave" aria-labelledby="leave-title"></section>
      </aside>
    </div>
  </div>

  <dialog id="card-dialog" class="dialog" aria-labelledby="card-dialog-title">
    <form id="card-form" autocomplete="off">
      <h2 id="card-dialog-title">작업 추가</h2>
      <label class="dialog-field">
        <span>작업 이름</span>
        <input name="title" type="text" maxlength="60" required>
      </label>
      <div class="dialog-field">
        <span>폴더</span>
        <div id="card-folder-picker" class="folder-picker"></div>
      </div>
      <label class="dialog-field">
        <span>진행률 <output id="card-progress-out" class="num">0%</output></span>
        <input name="progress" type="range" min="0" max="100" step="5" value="0">
      </label>
      <label class="dialog-field">
        <span>마지막으로 한 것</span>
        <input name="last" type="text" maxlength="100">
      </label>
      <label class="dialog-field">
        <span>다음 할 일</span>
        <input name="next" type="text" maxlength="100">
      </label>
      <label class="dialog-field">
        <span>막힌 점 <small>(없으면 비워두기)</small></span>
        <input name="blocked" type="text" maxlength="100">
      </label>
      <div class="dialog-actions">
        <button id="card-delete" type="button" class="danger-btn">삭제</button>
        <button type="button" class="ghost-btn" data-close>취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="memo-dialog" class="dialog" aria-labelledby="memo-dialog-title">
    <form id="memo-form" autocomplete="off">
      <h2 id="memo-dialog-title">퇴근 체크아웃</h2>
      <p class="dialog-desc">내일 아침의 나에게 한 줄 남겨두세요. 비워서 저장하면 메모가 지워져요.</p>
      <label class="dialog-field">
        <span>내일의 나에게</span>
        <input name="memo" type="text" maxlength="100" placeholder="예: 로그인 오류, 세션 만료 시간 설정부터 확인하기">
      </label>
      <div class="dialog-actions">
        <button type="button" class="ghost-btn" data-close>취소</button>
        <button type="submit" class="primary-btn">남기기</button>
      </div>
    </form>
  </dialog>

  <dialog id="dday-dialog" class="dialog" aria-labelledby="dday-dialog-title">
    <form id="dday-form" autocomplete="off">
      <h2 id="dday-dialog-title">D-day 추가</h2>
      <label class="dialog-field">
        <span>이름</span>
        <input name="title" type="text" maxlength="20" placeholder="예: 오픽 시험" required>
      </label>
      <label class="dialog-field">
        <span>날짜</span>
        <input name="date" type="date" required>
      </label>
      <div class="dialog-actions">
        <button id="dday-delete" type="button" class="danger-btn">삭제</button>
        <button type="button" class="ghost-btn" data-close>취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="leave-dialog" class="dialog" aria-labelledby="leave-dialog-title">
    <form id="leave-form" autocomplete="off">
      <h2 id="leave-dialog-title">연차 쓰기</h2>
      <label class="dialog-field">
        <span>종류</span>
        <select name="unit">
          <option value="1">연차 (하루)</option>
          <option value="0.5">반차 (0.5일)</option>
          <option value="0.25">반반차 (0.25일)</option>
        </select>
      </label>
      <div class="dialog-row">
        <label class="dialog-field">
          <span>날짜</span>
          <input name="start" type="date" required>
        </label>
        <label id="leave-end-field" class="dialog-field">
          <span>끝나는 날 <small>(여러 날일 때)</small></span>
          <input name="end" type="date">
        </label>
      </div>
      <output id="leave-preview" class="leave-preview"></output>
      <label class="dialog-field">
        <span>메모 <small>(선택)</small></span>
        <input name="memo" type="text" maxlength="40" placeholder="예: 가족 여행">
      </label>
      <div class="dialog-actions">
        <button id="leave-delete" type="button" class="danger-btn">삭제</button>
        <button type="button" class="ghost-btn" data-close>취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
