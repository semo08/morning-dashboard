<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <nav id="folder-tree" aria-label="폴더"></nav>

    <section id="todo-panel">
      <header class="panel-head">
        <h1 id="panel-title">전체</h1>
        <span id="panel-count" class="num"></span>
      </header>

      <form id="todo-form" class="card" autocomplete="off">
        <input id="todo-text" type="text" placeholder="할 일을 입력하고 Enter" required>
        <div class="form-row">
          <select id="todo-folder" aria-label="폴더"></select>
          <input id="todo-due" type="date" aria-label="마감일">
          <label class="repeat-check">
            <input id="todo-repeat" type="checkbox"> 매일 반복
          </label>
          <button type="submit">추가</button>
        </div>
      </form>

      <div id="todo-groups"></div>
    </section>
  </div>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
